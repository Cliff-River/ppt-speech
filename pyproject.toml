[project]
name = "ppt-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cliff Huang", email = "hzf510920@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "python-pptx>=1.0.2",
    "tinytag>=2.3.0",
]

[project.scripts]
ppt-speech = "ppt_speech:main"

[project.optional-dependencies]
test = [
    "coverage>=7.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["coverage>=7.0"]
