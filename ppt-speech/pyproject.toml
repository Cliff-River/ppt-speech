[project]
name = "ppt-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cliff Huang", email = "hzf510920@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "python-pptx>=1.0.2",
    "tinytag>=2.3.0",
]

[project.scripts]
ppt-speech = "ppt_speech:main"
ppt-speech-server = "ppt_speech.server:main"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "python-multipart>=0.0.9",
]
client = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
]
test = [
    "coverage>=7.0",
    "httpx>=0.27",
    "fakeredis>=2.21",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["coverage>=7.0"]
# 自引用：把 optional-dependencies 里的 extras 桥接成 dependency-group，
# 这样 default-groups 就能控制它们，且不必重复声明版本号。
server = ["ppt-speech[server]"]
client = ["ppt-speech[client]"]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
# uv sync / uv run 默认安装 server 与 client 组（仍可用 --no-group 排除）
default-groups = ["server", "client", "dev"]
